name: Sync to Hugging Face Spaces

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  sync-to-hf:
    name: Push to HF Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push -f https://astroAycha:$HF_TOKEN@huggingface.co/spaces/astroAycha/environment_monitor main
