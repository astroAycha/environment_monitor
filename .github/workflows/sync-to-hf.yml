name: Sync to Hugging Face Spaces
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hf:
    name: Push to HF Space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Build HF-only tree
        run: |
          mkdir -p /tmp/hf_deploy/scripts
          cp -r app.py requirements-dashboard.txt assets /tmp/hf_deploy/
          cp README.hf.md /tmp/hf_deploy/README.md   # <-- HF-specific README with front matter
          cp Dockerfile /tmp/hf_deploy/

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd /tmp/hf_deploy
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Sync from GitHub Actions" || echo "Nothing to commit"
          git push -f https://astroAycha:$HF_TOKEN@huggingface.co/spaces/astroAycha/environment_monitor HEAD:main